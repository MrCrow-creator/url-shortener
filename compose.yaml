name: url-shortener

x-api-environment: &api-environment
  NODE_ENV: production
  PORT: 3000
  BASE_URL: ${BASE_URL:-http://localhost:3100}
  DATABASE_URL: postgresql://${POSTGRES_USER:-shortener}:${POSTGRES_PASSWORD:-shortener_local}@postgres:5432/${POSTGRES_DB:-shortener}
  REDIS_URL: redis://redis:6379
  CACHE_ENABLED: ${CACHE_ENABLED:-true}
  CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-3600}
  REDIS_TIMEOUT_MS: ${REDIS_TIMEOUT_MS:-100}

x-api: &api
  image: url-shortener-service:local
  build:
    context: .
    target: runtime
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  api:
    <<: *api
    environment: *api-environment
    ports:
      - "127.0.0.1:${PORT:-3100}:3000"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shortener}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shortener_local}
      POSTGRES_DB: ${POSTGRES_DB:-shortener}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  tests:
    profiles: [test]
    build:
      context: .
      target: test
    environment:
      INTEGRATION_DATABASE_URL: postgresql://${POSTGRES_USER:-shortener}:${POSTGRES_PASSWORD:-shortener_local}@postgres:5432/${POSTGRES_DB:-shortener}
      INTEGRATION_REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  api-uncached:
    <<: *api
    profiles: [benchmark]
    environment:
      <<: *api-environment
      BASE_URL: http://localhost:${UNCACHED_PORT:-3101}
      CACHE_ENABLED: "false"
    ports:
      - "127.0.0.1:${UNCACHED_PORT:-3101}:3000"

volumes:
  postgres-data:
